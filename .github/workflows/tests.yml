name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the README minimum, 3.11 matches the Docker image.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The unit tests mock Amber and the AirTouch and use only the standard
      # library, so no dependencies need installing.
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
